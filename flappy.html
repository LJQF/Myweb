<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>飞扬的小鸟 · 小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237dd3fc'/%3E%3Ccircle cx='28' cy='34' r='14' fill='%23facc15'/%3E%3Ccircle cx='33' cy='30' r='5' fill='%23fff'/%3E%3Ccircle cx='34' cy='30' r='2' fill='%23111'/%3E%3Cpath d='M42 34l9 3-9 3z' fill='%23f97316'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<style>
  .view { animation: fadein .28s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .board-wrap {
    position: relative;
    width: min(48vh, 440px, 92vw);
    aspect-ratio: 2 / 3;
    border-radius: 18px;
    overflow: hidden;
    background: #7dd3fc;
    box-shadow: var(--shadow);
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    cursor: pointer;
  }
  #board { display: block; width: 100%; height: 100%; }

  .best {
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .best b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(8, 15, 24, .42);
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
    z-index: 5; animation: fadein .22s ease-out both;
  }
  .overlay[hidden] { display: none; }
  .ov-card { text-align: center; padding: 20px 24px; background: var(--surface-solid); border-radius: 16px; box-shadow: var(--shadow); max-width: 84%; }
  .ov-card h2 { margin: 0 0 6px; font-size: 22px; }
  .ov-card p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .ov-score { font-size: 34px; font-weight: 800; line-height: 1; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .ov-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .hint { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      主菜单
    </a>
    <h2>飞扬的小鸟</h2>
  </div>

  <main>
    <div class="stage">
      <div class="best">最高分 <b id="best-score">0</b></div>

      <div class="board-wrap" id="board-wrap">
        <canvas id="board"></canvas>
        <div class="overlay" id="overlay" hidden>
          <div class="ov-card">
            <h2 id="ov-title">撞上了</h2>
            <div class="ov-score" id="ov-score">0</div>
            <p id="ov-desc"></p>
            <div class="row">
              <button class="btn btn-primary" id="btn-again" type="button">再来一次</button>
            </div>
          </div>
        </div>
      </div>

      <p class="hint">点屏幕 / 按空格让它往上飞 · 别撞管子也别掉地上</p>
    </div>
  </main>

  <footer class="foot">分数越高管子越密、缺口越窄 · 最高分会记在这台设备上</footer>
</div>

<script src="js/flappy-engine.js"></script>
<script src="js/flappy.js"></script>
</body>
</html>
