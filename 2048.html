<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>2048 · 小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23edc22e'/%3E%3Ctext x='32' y='43' font-size='28' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23fff'%3E2048%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<style>
  .game {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .hud {
    width: min(94vw, 460px);
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 12px;
  }

  .scores { display: flex; gap: 10px; }

  .score-box {
    min-width: 92px;
    padding: 9px 14px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .score-box span {
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--muted);
    font-weight: 600;
  }

  .score-box strong {
    font-size: 21px;
    font-weight: 750;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
    transition: transform .18s ease, color .18s ease;
  }

  .score-box strong.bump { transform: scale(1.14); color: var(--accent); }

  .actions { display: flex; gap: 8px; align-items: stretch; }

  .actions .btn { padding: 0 15px; height: 100%; }

  /* ---------- 棋盘 ---------- */
  .board {
    --pad: 12px;
    --gap: 10px;
    --cell: 84px;
    position: relative;
    width: min(94vw, 460px);
    aspect-ratio: 1 / 1;
    padding: var(--pad);
    border-radius: 22px;
    background: var(--board);
    box-shadow: var(--shadow);
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .board.shake { animation: shake .22s ease-in-out; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .grid-bg {
    position: absolute;
    inset: var(--pad);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }

  .cell { background: var(--cell-bg); border-radius: 12px; }

  .tiles { position: absolute; inset: 0; }

  .tile {
    position: absolute;
    top: 0;
    left: 0;
    width: var(--cell);
    height: var(--cell);
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
    transition: transform .1s cubic-bezier(.35, .9, .4, 1);
    will-change: transform;
  }

  .board.no-anim .tile,
  .board.no-anim .tile-inner { transition: none !important; animation: none !important; }

  .tile-inner {
    width: 100%;
    height: 100%;
    display: grid;
    place-items: center;
    border-radius: inherit;
  }

  .tile-inner.appear { animation: appear .16s ease-out; }
  .tile-inner.pop { animation: pop .18s ease-out; }

  @keyframes appear {
    from { transform: scale(.35); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes pop {
    0% { transform: scale(.82); }
    55% { transform: scale(1.13); }
    100% { transform: scale(1); }
  }

  .tile[data-v="2"] { background: var(--t2); color: var(--tile-ink); }
  .tile[data-v="4"] { background: var(--t4); color: var(--tile-ink); }
  .tile[data-v="8"] { background: var(--t8); color: #fff; }
  .tile[data-v="16"] { background: var(--t16); color: #fff; }
  .tile[data-v="32"] { background: var(--t32); color: #fff; }
  .tile[data-v="64"] { background: var(--t64); color: #fff; }
  .tile[data-v="128"] { background: var(--t128); color: #fff; }
  .tile[data-v="256"] { background: var(--t256); color: #fff; }
  .tile[data-v="512"] { background: var(--t512); color: #fff; }
  .tile[data-v="1024"] { background: var(--t1024); color: #fff; }
  .tile[data-v="2048"] { background: var(--t2048); color: #fff; box-shadow: 0 0 26px -4px var(--t2048); }
  .tile[data-v="super"] { background: var(--t-super); color: var(--board); }

  /* ---------- 结束遮罩 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--bg-2) 78%, transparent);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
    z-index: 5;
    animation: fade .3s ease-out;
  }

  .overlay[hidden] { display: none; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .overlay-card {
    text-align: center;
    padding: 26px 30px;
    max-width: 86%;
  }

  .overlay-card h3 {
    margin: 0 0 8px;
    font-size: 26px;
    font-weight: 750;
    letter-spacing: .02em;
  }

  .overlay-card p {
    margin: 0 0 18px;
    font-size: 13.5px;
    color: var(--muted);
  }

  .overlay-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.7;
  }

  .hint kbd {
    font-family: inherit;
    font-size: 11.5px;
    padding: 2px 6px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
  }

  @media (max-width: 460px) {
    .hud { flex-direction: column; align-items: stretch; gap: 10px; }
    .actions { justify-content: flex-end; }
    .actions .btn { padding: 9px 14px; }
    .score-box { flex: 1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      主菜单
    </a>
    <h2>2048</h2>
  </div>

  <main class="game">
    <div class="hud">
      <div class="scores">
        <div class="score-box"><span>得分</span><strong id="score">0</strong></div>
        <div class="score-box"><span>最高</span><strong id="best">0</strong></div>
      </div>
      <div class="actions">
        <button class="btn" id="btn-undo" type="button">撤销</button>
        <button class="btn btn-primary" id="btn-new" type="button">新游戏</button>
      </div>
    </div>

    <div class="board" id="board" role="application" aria-label="2048 棋盘">
      <div class="grid-bg" id="grid-bg" aria-hidden="true"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h3 id="overlay-title">游戏结束</h3>
          <p id="overlay-desc">没有可以移动的方块了</p>
          <div class="overlay-actions">
            <button class="btn btn-primary" id="btn-retry" type="button">再来一局</button>
            <button class="btn" id="btn-keep" type="button" hidden>继续玩</button>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">
      用 <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动，手机上直接滑动
    </p>
  </main>

  <footer class="foot">凑到 2048 就算赢 · 可以一直玩下去</footer>
</div>

<script src="js/engine2048.js"></script>
<script src="js/game.js"></script>
</body>
</html>
