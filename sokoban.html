<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>推箱子 · 小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23d97706'/%3E%3Crect x='14' y='14' width='36' height='36' rx='6' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cpath d='M25 25l14 14M39 25L25 39' stroke='%23fff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<style>
  :root {
    --floor: #f3ede2;
    --floor-line: rgba(120, 90, 40, .08);
    --wall: #6b5844;
    --wall-top: #8a7358;
    --goal: #d97706;
    --box: #c98a4b;
    --box-dark: #a86c33;
    --box-ok: #16a34a;
    --box-ok-dark: #0f7a37;
    --player: #2563eb;
    --player-dark: #1d4ed8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --floor: #141b27;
      --floor-line: rgba(255, 255, 255, .05);
      --wall: #3b4a64;
      --wall-top: #4a5b79;
      --goal: #f59e0b;
      --box: #b4763a;
      --box-dark: #8e5626;
      --box-ok: #22c55e;
      --box-ok-dark: #15803d;
      --player: #3b82f6;
      --player-dark: #1d4ed8;
    }
  }

  .game-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .hud {
    width: min(92vw, 580px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .level-name { font-size: 15px; font-weight: 650; }
  .level-name b { color: var(--accent); font-variant-numeric: tabular-nums; }

  .counters { display: flex; gap: 8px; }

  .chip {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--surface);
    font-variant-numeric: tabular-nums;
  }

  .chip b { color: var(--ink); font-weight: 650; }

  .stage {
    position: relative;
    width: min(92vw, 580px);
    border-radius: 18px;
    background: var(--floor);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .tiles, .actors { position: absolute; inset: 0; }

  .tile {
    position: absolute;
    display: grid;
    place-items: center;
  }

  .tile.floor { background: var(--floor); box-shadow: inset 0 0 0 1px var(--floor-line); }
  .tile.wall {
    background: linear-gradient(160deg, var(--wall-top), var(--wall));
    border-radius: 6px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18), 0 2px 6px rgba(0, 0, 0, .22);
    transform: scale(.96);
  }

  .tile .goal-dot {
    width: 26%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: 2.5px solid var(--goal);
    opacity: .75;
  }

  .actor {
    position: absolute;
    display: grid;
    place-items: center;
    transition: left .12s ease, top .12s ease;
    will-change: left, top;
  }

  .box {
    width: 78%;
    height: 78%;
    border-radius: 7px;
    background: linear-gradient(160deg, var(--box), var(--box-dark));
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .22), 0 3px 8px rgba(0, 0, 0, .28);
    position: relative;
    transition: background .18s ease, box-shadow .18s ease;
  }

  .box::before, .box::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 56%;
    height: 2.5px;
    background: rgba(255, 255, 255, .55);
    border-radius: 2px;
  }

  .box::before { transform: translate(-50%, -50%) rotate(45deg); }
  .box::after { transform: translate(-50%, -50%) rotate(-45deg); }

  .box.on-goal {
    background: linear-gradient(160deg, var(--box-ok), var(--box-ok-dark));
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .3), 0 0 16px -2px var(--box-ok);
  }

  .player {
    width: 66%;
    height: 66%;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #93c5fd, var(--player) 60%, var(--player-dark));
    box-shadow: 0 4px 10px rgba(0, 0, 0, .35), inset 0 2px 4px rgba(255, 255, 255, .5);
    position: relative;
  }

  .player::before, .player::after {
    content: "";
    position: absolute;
    top: 36%;
    width: 16%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: #0b1220;
  }

  .player::before { left: 26%; }
  .player::after { right: 26%; }

  .overlay {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--bg-2) 76%, transparent);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    animation: fade .25s ease-out both;
    z-index: 5;
  }

  .overlay[hidden] { display: none; }

  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .ov-card { text-align: center; padding: 20px; }
  .ov-card h2 { margin: 0 0 6px; font-size: clamp(22px, 4.6vw, 30px); font-weight: 750; }
  .ov-card p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  .ov-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .controls .btn { padding: 9px 15px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .hint { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.8; }

  .hint kbd {
    font-family: inherit;
    font-size: 11.5px;
    padding: 2px 6px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
  }

  .pad { display: none; }

  @media (pointer: coarse) {
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 52px);
      grid-template-rows: repeat(2, 52px);
      gap: 8px;
      justify-content: center;
    }

    .pad button {
      width: 52px;
      height: 52px;
      border-radius: 13px;
      border: 1px solid var(--line);
      background: var(--surface-solid);
      color: var(--ink);
      font-size: 19px;
      box-shadow: var(--shadow-sm);
    }

    .pad button:active { transform: scale(.94); }
    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      主菜单
    </a>
    <h2>推箱子</h2>
  </div>

  <main class="game-wrap">
    <div class="hud">
      <div class="level-name">第 <b id="level-no">1</b> 关 / 共 <span id="level-total">8</span> 关</div>
      <div class="counters">
        <span class="chip">步数 <b id="moves">0</b></span>
        <span class="chip">推箱 <b id="pushes">0</b></span>
      </div>
    </div>

    <div class="stage" id="stage">
      <div class="tiles" id="tiles"></div>
      <div class="actors" id="actors"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="ov-card">
          <h2 id="ov-title">过关！</h2>
          <p id="ov-desc">用了 12 步</p>
          <div class="row">
            <button class="btn btn-primary" id="btn-next" type="button">下一关</button>
            <button class="btn" id="btn-replay" type="button">再玩一次</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="btn-prev" type="button">上一关</button>
      <button class="btn" id="btn-undo" type="button">撤销</button>
      <button class="btn" id="btn-reset" type="button">重置</button>
      <button class="btn" id="btn-next-lv" type="button">下一关</button>
    </div>

    <div class="pad" aria-hidden="true">
      <button class="up" data-dir="up" type="button">↑</button>
      <button class="left" data-dir="left" type="button">←</button>
      <button class="down" data-dir="down" type="button">↓</button>
      <button class="right" data-dir="right" type="button">→</button>
    </div>

    <p class="hint">
      <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>Z</kbd> 撤销 · <kbd>R</kbd> 重来
    </p>
  </main>

  <footer class="foot">把每个箱子推到橙色的目标点上 · 箱子只能推不能拉</footer>
</div>

<script src="js/engine-sokoban.js"></script>
<script src="js/sokoban-game.js"></script>
</body>
</html>
