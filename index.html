<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>主菜单 · 小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 34l10 10 18-22' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<style>
  .hero {
    margin: clamp(32px, 13vh, 132px) 0 clamp(28px, 5vh, 48px);
    text-align: center;
    animation: rise .6s cubic-bezier(.2, .8, .25, 1) both;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 15px 7px 11px;
    border-radius: 999px;
    background: var(--ok-soft);
    color: var(--ok);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .04em;
    border: 1px solid color-mix(in srgb, var(--ok) 22%, transparent);
  }

  .chip svg { width: 15px; height: 15px; }

  .hero h1 {
    margin: 22px 0 12px;
    font-size: clamp(30px, 6vw, 46px);
    font-weight: 700;
    letter-spacing: -.01em;
    line-height: 1.2;
  }

  .hero p {
    margin: 0;
    color: var(--muted);
    font-size: clamp(14px, 2.4vw, 16px);
  }

  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: clamp(14px, 2.4vw, 22px);
  }

  .app {
    position: relative;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px;
    border-radius: 22px;
    border: 1px solid var(--line);
    background: var(--surface);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    box-shadow: var(--shadow);
    text-decoration: none;
    overflow: hidden;
    transition: transform .22s cubic-bezier(.2, .8, .25, 1), border-color .22s ease, box-shadow .22s ease;
    animation: rise .7s cubic-bezier(.2, .8, .25, 1) both;
  }

  .app:nth-child(1) { animation-delay: .08s; }
  .app:nth-child(2) { animation-delay: .16s; }

  .app::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(320px 160px at 12% 0%, var(--accent-soft), transparent 70%);
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }

  .app:hover {
    transform: translateY(-4px);
    border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    box-shadow: 0 30px 60px -30px rgba(15, 23, 42, .55);
  }

  .app:hover::after { opacity: 1; }

  .app:active { transform: translateY(-1px) scale(.995); }

  .app-icon {
    flex: 0 0 auto;
    width: 62px;
    height: 62px;
    border-radius: 17px;
    display: grid;
    place-items: center;
    background: var(--surface-solid);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
  }

  .app-icon svg { width: 34px; height: 34px; display: block; }

  .app-body { min-width: 0; flex: 1 1 auto; }

  .app-body h3 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: 650;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    padding: 3px 8px;
    border-radius: 999px;
    color: var(--accent);
    background: var(--accent-soft);
  }

  .app-body p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  .app-arrow {
    flex: 0 0 auto;
    font-size: 18px;
    color: var(--muted);
    transition: transform .22s ease, color .22s ease;
  }

  .app:hover .app-arrow { transform: translateX(4px); color: var(--accent); }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 420px) {
    .app { padding: 18px; gap: 14px; }
    .app-icon { width: 52px; height: 52px; border-radius: 14px; }
    .app-icon svg { width: 28px; height: 28px; }
    .app-arrow { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 6 9 17l-5-5"/>
      </svg>
      站点创建成功
    </div>
    <h1>今天想玩点什么？</h1>
    <p>两个小应用，点开即用，不用登录。</p>
  </header>

  <main class="apps">
    <a class="app" href="2048.html">
      <span class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <rect x="4" y="4" width="19" height="19" rx="5" fill="#f2b179"/>
          <rect x="25" y="4" width="19" height="19" rx="5" fill="#ede0c8"/>
          <rect x="4" y="25" width="19" height="19" rx="5" fill="#ede0c8"/>
          <rect x="25" y="25" width="19" height="19" rx="5" fill="#f67c5f"/>
        </svg>
      </span>
      <span class="app-body">
        <h3>2048 <span class="badge">游戏</span></h3>
        <p>方向键或手指滑动合并数字，一路凑到 2048。</p>
      </span>
      <span class="app-arrow" aria-hidden="true">→</span>
    </a>

    <a class="app" href="plotter.html">
      <span class="app-icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M5 24h38M24 5v38" stroke="currentColor" stroke-opacity=".25" stroke-width="1.6"/>
          <path d="M5 33c6 0 9-18 15-18s6 18 12 18 6-9 11-9" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="app-body">
        <h3>函数绘图器 <span class="badge">工具</span></h3>
        <p>输入表达式实时画图，可拖动、缩放、叠加多条曲线。</p>
      </span>
      <span class="app-arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <footer class="foot">托管于 GitHub Pages · 无需联网依赖</footer>
</div>
</body>
</html>
