<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048</title>
<style>
  :root {
    --gap: 12px;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #faf8ef;
    color: #776e65;
    font-family: "Clear Sans", "Helvetica Neue", Arial, "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .app { width: 100%; max-width: 480px; }

  /* ---------- 顶部 ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .title {
    margin: 0;
    font-size: clamp(34px, 9vw, 56px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
  }

  .scores { display: flex; gap: 8px; }

  .score-box {
    min-width: 78px;
    padding: 6px 14px;
    border-radius: 6px;
    background: #bbada0;
    color: #f9f6f2;
    text-align: center;
  }

  .score-box .label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #eee4da;
  }

  .score-box .value {
    display: block;
    font-size: 20px;
    font-weight: 800;
    line-height: 1.2;
  }

  /* ---------- 工具栏 ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .hint {
    margin: 0;
    font-size: 13px;
    line-height: 1.5;
    color: #8f857d;
  }

  .btn {
    flex-shrink: 0;
    padding: 10px 18px;
    border: none;
    border-radius: 6px;
    background: #8f7a66;
    color: #f9f6f2;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s;
  }

  .btn:hover { background: #9f8b77; }
  .btn:active { transform: translateY(1px); }

  /* ---------- 棋盘 ---------- */
  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    padding: var(--gap);
    background: #bbada0;
    border-radius: 8px;
    touch-action: none;
  }

  .grid-bg {
    position: absolute;
    inset: var(--gap);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }

  .grid-bg > div {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 4px;
  }

  .tiles {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  /* ---------- 方块 ---------- */
  .tile {
    position: absolute;
    top: 0;
    left: 0;
    transition: transform 120ms ease-in-out;
    will-change: transform;
  }

  .tile-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    font-weight: 800;
    line-height: 1;
    transition: background-color 120ms ease, color 120ms ease;
  }

  .tile-new .tile-inner {
    animation: tile-appear 160ms ease-out;
  }

  .tile-merged .tile-inner {
    animation: tile-pop 200ms ease-out;
  }

  @keyframes tile-appear {
    from { transform: scale(0); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  @keyframes tile-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  .no-anim .tile { transition: none !important; }

  /* ---------- 结束遮罩 ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    border-radius: 8px;
    background: rgba(250, 248, 239, 0.88);
    backdrop-filter: blur(2px);
  }

  .overlay.show { display: flex; }

  .overlay-title {
    margin: 0;
    font-size: clamp(26px, 7vw, 36px);
    font-weight: 800;
  }

  @media (max-width: 400px) {
    .hint { font-size: 12px; }
    .score-box { min-width: 66px; padding: 5px 10px; }
    .score-box .value { font-size: 17px; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="label">得分</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="label">最高分</span>
        <span class="value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <p class="hint">方向键 ↑ ↓ ← → 或 W A S D 移动方块</p>
    <button class="btn" id="newGame">新游戏</button>
  </div>

  <div class="board" id="board">
    <div class="grid-bg" id="gridBg"></div>
    <div class="tiles" id="tiles"></div>
    <div class="overlay" id="overlay">
      <p class="overlay-title" id="overlayTitle">游戏结束</p>
      <button class="btn" id="overlayBtn">再来一局</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ======================= 常量 ======================= */
  const SIZE = 4;
  const GAP_RATIO = 0.03;   // 格子间距占棋盘宽度的比例
  const ANIM_MS = 120;      // 滑动动画时长，需与 CSS 中 transition 一致

  const COLORS = {
    2:    ['#eee4da', '#776e65'],
    4:    ['#ede0c8', '#776e65'],
    8:    ['#f2b179', '#f9f6f2'],
    16:   ['#f59563', '#f9f6f2'],
    32:   ['#f67c5f', '#f9f6f2'],
    64:   ['#f65e3b', '#f9f6f2'],
    128:  ['#edcf72', '#f9f6f2'],
    256:  ['#edcc61', '#f9f6f2'],
    512:  ['#edc850', '#f9f6f2'],
    1024: ['#edc53f', '#f9f6f2'],
    2048: ['#edc22e', '#f9f6f2']
  };
  const SUPER_COLOR = ['#3c3a32', '#f9f6f2'];

  // 方向 -> [行增量, 列增量]
  const DIRS = {
    up:    [-1, 0],
    down:  [ 1, 0],
    left:  [ 0, -1],
    right: [ 0, 1]
  };

  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  /* ======================= DOM ======================= */
  const boardEl     = document.getElementById('board');
  const gridBgEl    = document.getElementById('gridBg');
  const tilesEl     = document.getElementById('tiles');
  const scoreEl     = document.getElementById('score');
  const bestEl      = document.getElementById('best');
  const overlayEl   = document.getElementById('overlay');
  const overlayTitleEl = document.getElementById('overlayTitle');
  const overlayBtn  = document.getElementById('overlayBtn');
  const newGameBtn  = document.getElementById('newGame');

  /* ======================= 状态 ======================= */
  let cells = [];        // cells[r][c] = 方块对象 | null
  let tiles = [];        // 所有现存方块
  let score = 0;
  let best = readBest();
  let cellSize = 0;
  let gapSize = 0;
  let busy = false;      // 动画进行中，锁定输入
  let over = false;
  let won = false;

  /* ======================= 工具 ======================= */
  function readBest() {
    try { return Number(localStorage.getItem('best-2048')) || 0; }
    catch (e) { return 0; }
  }

  function saveBest(value) {
    try { localStorage.setItem('best-2048', String(value)); }
    catch (e) { /* 隐私模式下忽略 */ }
  }

  function inBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  /* ======================= 布局与渲染 ======================= */
  function updateLayout() {
    const width = boardEl.getBoundingClientRect().width;
    if (!width) return;

    gapSize = width * GAP_RATIO;
    cellSize = (width - gapSize * 5) / 4;

    boardEl.style.setProperty('--gap', gapSize + 'px');

    // 窗口变化时重排：先关掉过渡，避免方块乱飞
    tilesEl.classList.add('no-anim');
    for (const tile of tiles) {
      tile.el.style.width = cellSize + 'px';
      tile.el.style.height = cellSize + 'px';
      positionTile(tile);
      paintTile(tile);
    }
    void tilesEl.offsetWidth; // 强制重排
    requestAnimationFrame(() => tilesEl.classList.remove('no-anim'));
  }

  function positionTile(tile) {
    const x = gapSize + tile.c * (cellSize + gapSize);
    const y = gapSize + tile.r * (cellSize + gapSize);
    tile.el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }

  function fontSizeFor(value) {
    const len = String(value).length;
    if (len <= 2) return cellSize * 0.45;
    if (len === 3) return cellSize * 0.37;
    if (len === 4) return cellSize * 0.29;
    return cellSize * 0.23;
  }

  function paintTile(tile) {
    const color = COLORS[tile.value] || SUPER_COLOR;
    tile.inner.style.background = color[0];
    tile.inner.style.color = color[1];
    tile.inner.style.fontSize = fontSizeFor(tile.value) + 'px';
    tile.inner.textContent = tile.value;
  }

  /* ======================= 方块创建 ======================= */
  function createTile(r, c, value, isNew) {
    const el = document.createElement('div');
    el.className = 'tile';
    el.style.width = cellSize + 'px';
    el.style.height = cellSize + 'px';

    const inner = document.createElement('div');
    inner.className = 'tile-inner';
    el.appendChild(inner);

    const tile = { r: r, c: c, value: value, el: el, inner: inner };

    paintTile(tile);
    positionTile(tile);            // 先定位再入 DOM，避免从 (0,0) 飞过来
    if (isNew) el.classList.add('tile-new');

    tilesEl.appendChild(el);

    cells[r][c] = tile;
    tiles.push(tile);
    return tile;
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (!cells[r][c]) empty.push([r, c]);
      }
    }
    if (empty.length === 0) return;

    const pos = empty[Math.floor(Math.random() * empty.length)];
    createTile(pos[0], pos[1], Math.random() < 0.9 ? 2 : 4, true);
  }

  /* ======================= 分数 ======================= */
  function updateScore() {
    if (score > best) {
      best = score;
      saveBest(best);
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  /* ======================= 遮罩 ======================= */
  function showOverlay(title, btnText, onClick) {
    overlayTitleEl.textContent = title;
    overlayBtn.textContent = btnText;
    overlayBtn.onclick = onClick;
    overlayEl.classList.add('show');
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
  }

  /* ======================= 核心移动逻辑 ======================= */
  function move(dir) {
    if (busy || over) return;

    const delta = DIRS[dir];
    const dr = delta[0];
    const dc = delta[1];

    // 遍历顺序：先处理靠近移动方向的方块
    const rows = [0, 1, 2, 3];
    const cols = [0, 1, 2, 3];
    if (dr > 0) rows.reverse();
    if (dc > 0) cols.reverse();

    // 每回合重置合并标记
    for (const tile of tiles) tile.mergedThisTurn = false;

    let moved = false;
    const toRemove = [];   // 被合并掉的方块（动画结束后从 DOM 移除）
    const toGrow = [];     // 数值翻倍的目标方块

    for (const r of rows) {
      for (const c of cols) {
        const tile = cells[r][c];
        if (!tile) continue;

        let nr = r;
        let nc = c;
        let target = null;

        // 一直向前推进，直到撞墙 / 撞到不同数值 / 撞到可合并的同值方块
        while (true) {
          const tr = nr + dr;
          const tc = nc + dc;
          if (!inBounds(tr, tc)) break;

          const other = cells[tr][tc];
          if (!other) {
            nr = tr;
            nc = tc;
          } else if (other.value === tile.value && !other.mergedThisTurn) {
            nr = tr;
            nc = tc;
            target = other;
            break;
          } else {
            break;
          }
        }

        if (target) {
          // —— 合并 ——
          cells[r][c] = null;
          target.mergedThisTurn = true;
          target.value *= 2;
          score += target.value;

          tile.r = nr;
          tile.c = nc;
          positionTile(tile);        // 让被吞掉的方块滑过去再消失

          toRemove.push(tile);
          toGrow.push(target);
          tiles = tiles.filter(function (t) { return t !== tile; });
          moved = true;

        } else if (nr !== r || nc !== c) {
          // —— 单纯移动 ——
          cells[r][c] = null;
          cells[nr][nc] = tile;
          tile.r = nr;
          tile.c = nc;
          positionTile(tile);
          moved = true;
        }
      }
    }

    if (!moved) return;

    busy = true;

    setTimeout(function () {
      // 1. 移除被合并的方块
      for (const tile of toRemove) tile.el.remove();

      // 2. 更新合并后的方块
      for (const tile of toGrow) {
        paintTile(tile);
        tile.el.classList.add('tile-merged');
        setTimeout(function () {
          tile.el.classList.remove('tile-merged');
        }, 220);
      }

      updateScore();

      // 3. 胜利判定
      if (!won) {
        for (const tile of tiles) {
          if (tile.value >= 2048) {
            won = true;
            showOverlay('你赢了！🎉', '继续游戏', hideOverlay);
            break;
          }
        }
      }

      // 4. 补充新方块
      addRandomTile();

      // 5. 失败判定
      if (!canMove()) {
        over = true;
        setTimeout(function () {
          showOverlay('游戏结束', '再来一局', newGame);
        }, 200);
      }

      busy = false;
    }, ANIM_MS);
  }

  /* ======================= 判定 ======================= */
  function canMove() {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const tile = cells[r][c];
        if (!tile) return true;                      // 还有空位
        if (c + 1 < SIZE && cells[r][c + 1] &&
            cells[r][c + 1].value === tile.value) return true;
        if (r + 1 < SIZE && cells[r + 1][c] &&
            cells[r + 1][c].value === tile.value) return true;
      }
    }
    return false;
  }

  /* ======================= 新游戏 ======================= */
  function newGame() {
    tilesEl.innerHTML = '';
    cells = [];
    for (let r = 0; r < SIZE; r++) {
      cells.push(new Array(SIZE).fill(null));
    }
    tiles = [];
    score = 0;
    over = false;
    won = false;
    busy = false;

    hideOverlay();
    updateScore();
    updateLayout();

    addRandomTile();
    addRandomTile();
  }

  /* ======================= 事件绑定 ======================= */
  window.addEventListener('keydown', function (e) {
    const dir = KEYMAP[e.key];
    if (!dir) return;

    e.preventDefault();          // 阻止方向键滚动页面
    if (over) return;

    // 胜利后按任意方向键 = 继续游戏
    if (overlayEl.classList.contains('show')) hideOverlay();

    move(dir);
  }, { passive: false });

  newGameBtn.addEventListener('click', newGame);

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(updateLayout, 100);
  });

  /* ======================= 初始化 ======================= */
  function init() {
    // 生成 16 个背景格子
    for (let i = 0; i < SIZE * SIZE; i++) {
      gridBgEl.appendChild(document.createElement('div'));
    }

    bestEl.textContent = best;
    newGame();

    // 极少数情况下首次拿不到宽度，补一次
    if (!cellSize) {
      requestAnimationFrame(function () {
        updateLayout();
      });
    }
  }

  init();
})();
</script>
</body>
</html>
