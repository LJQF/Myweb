<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>站点创建成功</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2316a34a'/%3E%3Cpath d='M18 33.5l9.5 9.5L47 22' fill='none' stroke='%23fff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg-1: #eef5ff;
    --bg-2: #f8fbfd;
    --bg-3: #e9eff6;
    --ink: #0f172a;
    --ok: #16a34a;
    --ok-soft: rgba(22, 163, 74, .12);
    --shadow: 0 24px 60px -28px rgba(15, 23, 42, .35);
    --card: rgba(255, 255, 255, .72);
    --line: rgba(15, 23, 42, .07);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg-1: #0d1726;
      --bg-2: #0b1220;
      --bg-3: #080d16;
      --ink: #e8eef7;
      --ok: #34d399;
      --ok-soft: rgba(52, 211, 153, .14);
      --shadow: 0 30px 70px -30px rgba(0, 0, 0, .85);
      --card: rgba(17, 26, 41, .66);
      --line: rgba(255, 255, 255, .08);
    }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    color: var(--ink);
    background:
      radial-gradient(900px 520px at 50% 12%, var(--bg-1) 0%, transparent 62%),
      linear-gradient(160deg, var(--bg-2) 0%, var(--bg-3) 100%);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .card {
    width: min(520px, 100%);
    padding: 56px 40px 60px;
    text-align: center;
    border: 1px solid var(--line);
    border-radius: 28px;
    background: var(--card);
    box-shadow: var(--shadow);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    animation: card-in .7s cubic-bezier(.2, .8, .25, 1) both;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  .check {
    width: 92px;
    height: 92px;
    margin: 0 auto 30px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: var(--ok-soft);
    animation: pulse 2.8s ease-in-out 1.1s infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }

  .check svg { width: 56px; height: 56px; display: block; overflow: visible; }

  .check circle {
    stroke: var(--ok);
    stroke-width: 2.6;
    stroke-dasharray: 151;
    stroke-dashoffset: 151;
    animation: draw .75s ease-out .15s forwards;
  }

  .check path {
    stroke: var(--ok);
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 34;
    stroke-dashoffset: 34;
    animation: draw .45s ease-out .78s forwards;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  h1 {
    margin: 0;
    font-size: clamp(26px, 6.4vw, 38px);
    font-weight: 650;
    letter-spacing: .06em;
    line-height: 1.35;
    animation: text-in .6s ease-out .55s both;
  }

  @keyframes text-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  @media (max-width: 420px) {
    .card { padding: 44px 24px 48px; border-radius: 22px; }
    .check { width: 78px; height: 78px; margin-bottom: 24px; }
    .check svg { width: 46px; height: 46px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .card, .check, h1 { animation: none; }
    .check circle, .check path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 52 52" role="img" focusable="false">
        <circle cx="26" cy="26" r="24" fill="none"/>
        <path fill="none" d="M14.5 27.2 L22.6 35.2 L37.8 19.2"/>
      </svg>
    </div>
    <h1>站点创建成功</h1>
  </main>
</body>
</html>
