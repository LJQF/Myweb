<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>泡泡堂 · 小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230ea5e9'/%3E%3Ccircle cx='32' cy='34' r='16' fill='%23bae6fd'/%3E%3Ccircle cx='26' cy='28' r='4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<style>
  .view { animation: fadein .28s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  #view-lobby {
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: calc(100vh - 260px);
  }
  #view-lobby[hidden] { display: none; }

  .hero { text-align: center; margin: 0 0 clamp(22px, 4vh, 36px); }
  .hero h1 { margin: 0 0 10px; font-size: clamp(28px, 5.6vw, 42px); font-weight: 700; }
  .hero p { margin: 0; color: var(--muted); font-size: clamp(13.5px, 2.4vw, 15px); }

  .modes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
  }

  .mode {
    position: relative;
    text-align: left;
    padding: 22px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--surface);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
    backdrop-filter: saturate(180%) blur(18px);
    box-shadow: var(--shadow);
    color: var(--ink);
    font: inherit;
    cursor: pointer;
    overflow: hidden;
    transition: transform .2s cubic-bezier(.2,.8,.25,1), border-color .2s ease;
  }
  .mode:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .mode:active { transform: translateY(-1px) scale(.995); }
  .mode-num { position: absolute; right: 16px; top: 12px; font-size: 32px; font-weight: 800; opacity: .07; }
  .mode h3 { margin: 0 0 6px; font-size: 17px; font-weight: 650; }
  .mode p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }

  #view-code, #view-join { text-align: center; max-width: 520px; margin: 0 auto; padding-top: clamp(20px, 8vh, 72px); }
  #view-code h2, #view-join h2 { font-size: clamp(18px, 3.4vw, 22px); font-weight: 600; color: var(--muted); margin: 0 0 22px; }

  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(38px, 11vw, 62px);
    font-weight: 700; letter-spacing: .12em;
    padding: 18px 0 18px .12em;
    border-radius: 18px;
    background: var(--surface-solid);
    border: 1px dashed color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--accent);
    box-shadow: var(--shadow);
    user-select: all;
  }

  .code-input {
    width: 100%;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: clamp(30px, 8vw, 46px);
    font-weight: 700; letter-spacing: .1em; text-align: center;
    padding: 16px 10px; border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--surface-solid);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .code-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .code-input::placeholder { color: var(--muted); opacity: .35; }
  .code-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
  .waiting { margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 13.5px; }
  .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
  .err { min-height: 20px; margin: 12px 0 0; color: #ef4444; font-size: 13px; }

  /* ---------------- 游戏 ---------------- */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; }

  .hud {
    width: min(96vw, 760px);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    font-size: 13px; color: var(--muted);
  }

  .hud .who { display: flex; align-items: center; gap: 8px; }
  .hud .dot { width: 11px; height: 11px; border-radius: 50%; }

  .board-wrap {
    position: relative;
    width: min(96vw, 760px);
    aspect-ratio: 13 / 11;
    border-radius: 16px;
    overflow: hidden;
    background: #2f6b3a;
    box-shadow: var(--shadow);
    touch-action: none;
  }

  #board { display: block; width: 100%; height: 100%; }

  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    background: rgba(8, 15, 24, .62);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    z-index: 5;
    animation: fadein .25s ease-out both;
  }
  .overlay[hidden] { display: none; }
  .ov-card { text-align: center; padding: 24px 28px; background: var(--surface-solid); border-radius: 18px; box-shadow: var(--shadow); }
  .ov-card h2 { margin: 0 0 8px; font-size: 26px; }
  .ov-card p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  .ov-card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .hint { margin: 0; font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.8; }
  .hint kbd { font-family: inherit; font-size: 11.5px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); }

  /* 手机方向键 */
  .pad { display: none; }
  @media (pointer: coarse) {
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(2, 56px);
      gap: 8px;
      margin-top: 4px;
    }
    .pad button {
      width: 56px; height: 56px; border-radius: 14px;
      border: 1px solid var(--line); background: var(--surface-solid);
      color: var(--ink); font-size: 20px; box-shadow: var(--shadow-sm);
      -webkit-user-select: none; user-select: none;
    }
    .pad button:active { transform: scale(.94); }
    .pad .up { grid-column: 2; grid-row: 1; }
    .pad .left { grid-column: 1; grid-row: 2; }
    .pad .down { grid-column: 2; grid-row: 2; }
    .pad .right { grid-column: 3; grid-row: 2; }
    .pad .bomb { grid-column: 3; grid-row: 1; background: var(--accent); color: #fff; border-color: transparent; font-size: 15px; font-weight: 700; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      主菜单
    </a>
    <h2>泡泡堂</h2>
  </div>

  <main>
    <!-- 大厅 -->
    <section id="view-lobby" class="view">
      <div class="hero">
        <h1>泡泡堂</h1>
        <p>放水泡把对手炸掉，最后一个活着的赢。</p>
      </div>
      <div class="modes">
        <button class="mode" id="btn-solo" type="button">
          <span class="mode-num">01</span>
          <h3>单人挑战</h3>
          <p>和电脑打一场</p>
        </button>
        <button class="mode" id="btn-host" type="button">
          <span class="mode-num">02</span>
          <h3>创建房间</h3>
          <p>生成 8 位数字发给对手</p>
        </button>
        <button class="mode" id="btn-join" type="button">
          <span class="mode-num">03</span>
          <h3>加入房间</h3>
          <p>输入对方的 8 位数字</p>
        </button>
      </div>
    </section>

    <!-- 房间号 -->
    <section id="view-code" class="view" hidden>
      <h2>把这个数字发给对手</h2>
      <div class="code" id="room-code">--------</div>
      <div class="code-actions">
        <button class="btn" id="btn-copy" type="button">复制数字</button>
        <button class="btn btn-ghost" id="btn-cancel-host" type="button">取消</button>
      </div>
      <div class="waiting"><span class="pulse"></span><span id="host-status">等待对手加入…</span></div>
    </section>

    <!-- 加入 -->
    <section id="view-join" class="view" hidden>
      <h2>输入对手的 8 位数字</h2>
      <input id="join-input" class="code-input" type="text" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="00000000" aria-label="房间数字">
      <p class="err" id="join-error"></p>
      <div class="code-actions">
        <button class="btn btn-primary" id="btn-do-join" type="button">加入对局</button>
        <button class="btn btn-ghost" id="btn-cancel-join" type="button">返回</button>
      </div>
    </section>

    <!-- 游戏 -->
    <section id="view-game" class="view" hidden>
      <div class="stage">
        <div class="hud">
          <div class="who"><span class="dot" id="dot-a"></span><span id="name-a">你</span></div>
          <div id="hud-mid">13 × 11</div>
          <div class="who"><span id="name-b">对手</span><span class="dot" id="dot-b"></span></div>
        </div>

        <div class="board-wrap" id="board-wrap">
          <canvas id="board"></canvas>
          <div class="overlay" id="overlay" hidden>
            <div class="ov-card">
              <h2 id="ov-title">你赢了</h2>
              <p id="ov-desc"></p>
              <div class="row">
                <button class="btn btn-primary" id="btn-again" type="button">再来一局</button>
                <button class="btn" id="btn-back" type="button">回到大厅</button>
              </div>
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-ghost" id="btn-leave" type="button">离开</button>
        </div>

        <div class="pad">
          <button class="up" data-dir="up" type="button">↑</button>
          <button class="bomb" data-act="bomb" type="button">水泡</button>
          <button class="left" data-dir="left" type="button">←</button>
          <button class="down" data-dir="down" type="button">↓</button>
          <button class="right" data-dir="right" type="button">→</button>
        </div>

        <p class="hint">
          <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 · <kbd>空格</kbd> 放水泡
        </p>
      </div>
    </section>
  </main>

  <footer class="foot">打爆木箱会掉道具：水泡+ / 火力+ / 速度+ · 别站在水柱里</footer>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/vendor/mqtt.min.js?v=18"></script>
<script src="js/engine-bnb.js?v=20"></script>
<script src="js/net.js?v=18"></script>
<script src="js/bnb-game.js?v=20"></script>
</body>
</html>
