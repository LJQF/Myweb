<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f9fc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<title>白板 · 小站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f8fafc'/%3E%3Cpath d='M16 44l6-16 18-14 6 8-18 14z' fill='%233b82f6'/%3E%3Ccircle cx='18' cy='46' r='4' fill='%23ef4444'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/site.css">
<style>
  .view { animation: fadein .24s ease-out both; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .wb { width: 100%; max-width: 1320px; margin: 0 auto; }

  /* ================= 桌面（灰底） ================= */
  .desk {
    position: relative;
    display: flex;
    gap: 10px;
    height: calc(100vh - 168px);
    min-height: 430px;
    padding: 6px 8px;
    border-radius: 16px;
    background: #e7ecf3;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  @media (prefers-color-scheme: dark) {
    .desk { background: #151a22; }
  }

  /* ================= 顶部悬浮工具条 ================= */
  .dock {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    border-radius: 14px;
    background: rgba(255, 255, 255, .96);
    border: 1px solid rgba(15, 23, 42, .08);
    box-shadow: 0 10px 30px rgba(15, 23, 42, .16);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    width: max-content;
    max-width: calc(100% - 20px);
    flex-wrap: wrap;
    justify-content: center;
  }
  @media (prefers-color-scheme: dark) {
    .dock { background: rgba(23, 29, 38, .96); border-color: rgba(255,255,255,.08); }
  }

  .tb {
    position: relative;
    display: inline-flex; align-items: center; gap: 5px;
    height: 34px; padding: 0 10px;
    border: 0; border-radius: 9px;
    background: transparent; color: #1f2937;
    font: 500 13px/1 inherit; cursor: pointer; white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) { .tb { color: #e5e7eb; } }
  .tb:hover { background: rgba(59, 130, 246, .10); }
  .tb.on { background: rgba(59, 130, 246, .14); color: #2563eb; }
  @media (prefers-color-scheme: dark) { .tb.on { color: #60a5fa; } }
  .tb svg { width: 17px; height: 17px; }
  .tb.ico { width: 34px; padding: 0; justify-content: center; }
  .tb-sep { width: 1px; height: 20px; background: rgba(15, 23, 42, .12); margin: 0 3px; }
  @media (prefers-color-scheme: dark) { .tb-sep { background: rgba(255,255,255,.12); } }

  /* 弹出面板 */
  .fly {
    position: absolute; top: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    display: none; flex-direction: column; gap: 8px;
    padding: 10px; border-radius: 12px;
    background: #fff; border: 1px solid rgba(15,23,42,.08);
    box-shadow: 0 12px 34px rgba(15,23,42,.2);
    z-index: 30;
  }
  @media (prefers-color-scheme: dark) { .fly { background: #1b2230; border-color: rgba(255,255,255,.1); } }
  .grp.open .fly { display: flex; }
  .fly-row { display: flex; gap: 6px; align-items: center; }

  .sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .sw.on { border-color: #2563eb; }
  .wd { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(15,23,42,.14); background: #fff; cursor: pointer; display: grid; place-items: center; padding: 0; }
  @media (prefers-color-scheme: dark) { .wd { background: #232b38; border-color: rgba(255,255,255,.14); } }
  .wd.on { border-color: #2563eb; box-shadow: 0 0 0 2px rgba(59,130,246,.2); }
  .wd i { display: block; background: currentColor; border-radius: 50%; }

  /* ================= 画布区 ================= */
  .slide-area {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 58px 6px 44px;
  }
  #board {
    display: block;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 10px 34px rgba(15, 23, 42, .18);
    touch-action: none;
    cursor: crosshair;
  }

  /* ================= 右侧缩略图 ================= */
  .thumbs {
    width: 128px;
    display: flex; flex-direction: column; gap: 8px;
    padding: 58px 4px 44px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .thumbs::-webkit-scrollbar { width: 6px; }
  .thumbs::-webkit-scrollbar-thumb { background: rgba(15,23,42,.18); border-radius: 3px; }

  .thumb {
    position: relative;
    width: 100%;
    padding: 0; border: 2px solid transparent; border-radius: 8px;
    background: #fff; cursor: pointer; overflow: hidden;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .12);
  }
  .thumb canvas { display: block; width: 100%; aspect-ratio: 16 / 9; }
  .thumb b {
    position: absolute; left: 4px; bottom: 3px;
    font: 600 10px/1 inherit; color: #475569;
    background: rgba(255,255,255,.85); border-radius: 4px; padding: 2px 4px;
  }
  .thumb.on { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(59,130,246,.18); }
  .thumb .x {
    position: absolute; right: 2px; top: 2px;
    width: 18px; height: 18px; border-radius: 50%;
    border: 0; background: rgba(15,23,42,.72); color: #fff;
    font-size: 12px; line-height: 1; cursor: pointer; display: none;
  }
  .thumb:hover .x { display: block; }

  .thumb-add {
    width: 100%; height: 42px; border-radius: 8px;
    border: 1px dashed rgba(15,23,42,.28); background: transparent;
    color: #475569; font: 500 12px/1 inherit; cursor: pointer;
  }
  .thumb-add:hover { border-color: #2563eb; color: #2563eb; }

  /* ================= 底部翻页 ================= */
  .pager {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px; border-radius: 10px;
    background: rgba(255, 255, 255, .92);
    box-shadow: 0 4px 14px rgba(15, 23, 42, .14);
    font: 600 12px/1 inherit; color: #334155;
    font-variant-numeric: tabular-nums;
  }
  @media (prefers-color-scheme: dark) { .pager { background: rgba(23,29,38,.94); color: #d1d5db; } }
  .pager button {
    width: 24px; height: 24px; border-radius: 7px; border: 0;
    background: transparent; color: inherit; cursor: pointer; font-size: 15px; line-height: 1;
  }
  .pager button:hover { background: rgba(59,130,246,.12); }
  .pager b { min-width: 42px; text-align: center; }

  .text-input {
    position: absolute; z-index: 40; min-width: 150px;
    padding: 6px 8px; border-radius: 8px; border: 2px solid #2563eb;
    background: #fff; color: #111827; font-size: 18px; outline: none;
    box-shadow: 0 8px 26px rgba(0,0,0,.2);
  }

  .tip { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }

  @media (max-width: 760px) {
    .thumbs { width: 84px; }
    .desk { height: calc(100vh - 150px); }
    .tb span { display: none; }
    .tb { padding: 0 8px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      主菜单
    </a>
    <h2>白板</h2>
  </div>

  <main class="wb">
    <div class="desk" id="desk">
      <!-- 顶部悬浮工具条 -->
      <div class="dock" id="dock">
        <div class="grp" id="grp-pen">
          <button class="tb on" data-tool="pen" type="button" title="笔（点开选颜色和粗细）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
            <span>笔</span>
          </button>
          <div class="fly" id="fly-pen"></div>
        </div>

        <button class="tb" data-tool="highlighter" type="button" title="荧光笔">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l-6 6v3h3l6-6"/><path d="M22 12l-4.5 4.5-6-6L16 6z"/></svg>
          <span>荧光笔</span>
        </button>

        <button class="tb" data-tool="eraser" type="button" title="橡皮">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l6-6 9 9-3 3H6z"/><path d="M9 9l6-6 9 9-6 6"/></svg>
          <span>橡皮</span>
        </button>

        <div class="grp" id="grp-shape">
          <button class="tb" data-tool="rect" type="button" title="形状（点开更多）">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
            <span>形状</span>
          </button>
          <div class="fly" id="fly-shape"></div>
        </div>

        <button class="tb" data-tool="text" type="button" title="文字">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6h14M12 6v13M9 19h6"/></svg>
          <span>文字</span>
        </button>

        <span class="tb-sep"></span>

        <button class="tb ico" id="btn-undo" type="button" title="撤销 Ctrl+Z">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/></svg>
        </button>
        <button class="tb ico" id="btn-redo" type="button" title="重做 Ctrl+Y">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/></svg>
        </button>
        <button class="tb ico" id="btn-clear" type="button" title="清空本页">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        </button>

        <span class="tb-sep"></span>

        <div class="grp" id="grp-bg">
          <button class="tb" id="btn-bg" type="button" title="背景">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></svg>
            <span>背景</span>
          </button>
          <div class="fly" id="fly-bg"></div>
        </div>

        <button class="tb" id="btn-export" type="button" title="导出当前页为图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 21h16"/></svg>
          <span>导出</span>
        </button>
        <button class="tb" id="btn-full" type="button" title="全屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg>
          <span>全屏</span>
        </button>
      </div>

      <!-- 画布 -->
      <div class="slide-area" id="slide-area">
        <canvas id="board"></canvas>
      </div>

      <!-- 右侧页面缩略图 -->
      <aside class="thumbs" id="thumbs"></aside>

      <!-- 底部翻页 -->
      <div class="pager">
        <button id="btn-prev" type="button" title="上一页">‹</button>
        <b id="page-label">1 / 1</b>
        <button id="btn-next" type="button" title="下一页">›</button>
      </div>
    </div>

    <p class="tip">鼠标 / 手指 / 手写笔都能写 · <b>Ctrl+Z</b> 撤销 · 内容自动存在这台设备上</p>
  </main>
</div>

<script src="js/whiteboard-model.js?v=2"></script>
<script src="js/whiteboard.js?v=2"></script>
</body>
</html>
